name: Python demo tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run reconciliation demo tests
        working-directory: demo/python-reconciliation-demo
        run: python -m unittest discover -s tests -v
      - name: Run reconciliation demo
        working-directory: demo/python-reconciliation-demo
        run: python run_demo.py
